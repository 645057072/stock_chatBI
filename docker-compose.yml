# ChatBI — 阿里云 ECS Docker 部署（与本机其它应用隔离）
#
# - Web 入口端口由 .env 中 CHATBI_HTTP_PORT / CHATBI_HTTPS_PORT 配置（勿占用其它业务已用端口）。
# - MySQL / Redis 默认仅在 Compose 网络内访问（不向宿主机映射端口），避免与 ECS 上其它中间件端口冲突。
# - 连接信息可在 .env 中手动配置：CHATBI_MYSQL_HOST、CHATBI_MYSQL_PORT、MYSQL_USER、MYSQL_PASSWORD、
#   MYSQL_DATABASE、REDIS_URL（内置默认值见 .env.example）。
# - 首次启动：MySQL 容器会自动执行 schema.sql、deploy/init-app.sql 完成库表初始化。
#
# 首次部署建议：chmod +x ecs-first-up.sh && ./ecs-first-up.sh

services:
  mysql:
    image: mysql:8.0
    # shared memory 过小会导致 InnoDB 在部分主机上异常退出；有助于缓解 ioctl / daemon 检测类错误
    shm_size: 256mb
    command:
      - mysqld
      - --port=13306
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-use-native-aio=0
      - --innodb-buffer-pool-size=128M
      - --max-allowed-packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat_bi_case}
      MYSQL_TCP_PORT: "13306"
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - chatbi_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./deploy/init-app.sql:/docker-entrypoint-initdb.d/02_init_app.sql:ro
    networks:
      chatbi_internal:
        aliases:
          - mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -P13306 -uroot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  redis:
    image: redis:7-alpine
    networks:
      chatbi_internal:
        aliases:
          - redis
    command: ["redis-server", "--appendonly", "yes", "--port", "16379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    environment:
      CHATBI_MYSQL_HOST: ${CHATBI_MYSQL_HOST:-mysql}
      CHATBI_MYSQL_PORT: ${CHATBI_MYSQL_PORT:-13306}
      MYSQL_HOST: ${CHATBI_MYSQL_HOST:-mysql}
      MYSQL_PORT: ${CHATBI_MYSQL_PORT:-13306}
      MYSQL_USER: ${MYSQL_USER:-root}
      # 内置 MySQL 时请在 .env 中设置 MYSQL_PASSWORD（与 MYSQL_ROOT_PASSWORD 一致）；连接 RDS 时填写 RDS 账号密码
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat_bi_case}
      REDIS_URL: ${REDIS_URL:-redis://redis:16379/0}
      STOCK_BOT_IMAGE_DIR: /app/image_show
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatbi_images:/app/image_show
    networks:
      - chatbi_internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    ports:
      - "${CHATBI_HTTP_PORT:-18080}:80"
      - "${CHATBI_HTTPS_PORT:-18443}:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - chatbi_internal

networks:
  chatbi_internal:
    driver: bridge

volumes:
  chatbi_mysql_data:
  chatbi_images:
