# ChatBI 一键编排：
# - 默认使用 Compose 项目名前缀隔离网络/卷（强烈建议在服务器设置唯一 COMPOSE_PROJECT_NAME）
# - 宿主机 Web：18080 / 18443（避免与 Ai_Eaxm_system 的 80 冲突）
# - MySQL / Redis：容器内与宿主机映射均使用 13306 / 16379，不再使用 3306 / 6379（与考试系统默认端口彻底错开）
# 示例：
#   export COMPOSE_PROJECT_NAME=chatbi_case_prod
#   export CHATBI_HTTP_PORT=18080
#   export CHATBI_HTTPS_PORT=18443

services:
  mysql:
    image: mysql:8.0
    # innodb-use-native-aio=0：缓解 ECS/overlay 上 Inappropriate ioctl for device
    # max-allowed-packet：减轻 docker-entrypoint 执行大 SQL 时出现 Lost connection during query
    command:
      - mysqld
      - --port=13306
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-use-native-aio=0
      - --innodb-buffer-pool-size=128M
      - --max-allowed-packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: chat_bi_case
      # 与 --port 一致，供官方 entrypoint 在初始化阶段连接临时实例
      MYSQL_TCP_PORT: "13306"
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "127.0.0.1:13306:13306"
    volumes:
      - chatbi_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./deploy/init-app.sql:/docker-entrypoint-initdb.d/02_init_app.sql:ro
    networks:
      chatbi_internal:
        aliases:
          - mysql
    # 使用 MYSQL_PWD，避免 root 密码中含 @、! 等字符时在 -p"..." 下被 shell 误解析
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -P13306 -uroot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:16379"
    networks:
      chatbi_internal:
        aliases:
          - redis
    command: ["redis-server", "--appendonly", "yes", "--port", "16379"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    environment:
      CHATBI_MYSQL_HOST: mysql
      CHATBI_MYSQL_PORT: "13306"
      MYSQL_HOST: mysql
      MYSQL_PORT: "13306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: chat_bi_case
      REDIS_URL: redis://redis:16379/0
      STOCK_BOT_IMAGE_DIR: /app/image_show
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - chatbi_images:/app/image_show
    networks:
      - chatbi_internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    ports:
      - "${CHATBI_HTTP_PORT:-18080}:80"
      - "${CHATBI_HTTPS_PORT:-18443}:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - chatbi_internal

networks:
  chatbi_internal:
    driver: bridge

volumes:
  chatbi_mysql_data:
  chatbi_images:
