# ChatBI — 阿里云 ECS Docker 部署（与本机其它应用隔离）
#
# - Web 入口端口由 .env 中 CHATBI_HTTP_PORT / CHATBI_HTTPS_PORT 配置（勿占用其它业务已用端口）。
# - MySQL / Redis 默认仅在 Compose 网络内访问（不向宿主机映射端口），避免与 ECS 上其它中间件端口冲突。
#   因此用 Navicat 填「ECS 公网 IP:3309」会连接被拒绝（10061），属预期；需 SSH 隧道或临时放开 ports（见 mysql 服务下注释）。
# - 连接信息可在 .env 中手动配置：CHATBI_MYSQL_HOST、CHATBI_MYSQL_PORT、MYSQL_USER、MYSQL_PASSWORD、
#   MYSQL_DATABASE、REDIS_URL（内置默认值见 .env.example）。
# - 首次启动：MySQL 容器会自动执行 schema.sql、deploy/init-app.sql 完成库表初始化。
#
# 首次部署建议：chmod +x ecs-first-up.sh && ./ecs-first-up.sh

services:
  mysql:
    image: mysql:8.0
    # 容器名仅便于 docker logs；API 连库请用 Compose 服务名「mysql」（内置 DNS 稳定），勿默认用 container_name
    container_name: ${COMPOSE_PROJECT_NAME:-chatbi_case}_mysql
    # shared memory 过小会导致 InnoDB 在部分主机上异常退出；有助于缓解 ioctl / daemon 检测类错误
    shm_size: 256mb
    command:
      - mysqld
      - --port=3309
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-use-native-aio=0
      - --innodb-buffer-pool-size=128M
      - --max-allowed-packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat_bi_case}
      MYSQL_TCP_PORT: "3309"
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - chatbi_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./deploy/init-app.sql:/docker-entrypoint-initdb.d/02_init_app.sql:ro
    networks:
      chatbi_internal:
        aliases:
          - mysql
    # 默认不映射：外网 Navicat 直连公网 IP:3309 会失败。若必须远程连库（注意安全组与密码）：取消下行注释
    # ports:
    #   - "3309:3309"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -P3309 -uroot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      # 首次初始化 InnoDB + schema/init sql 可能较慢
      start_period: 300s

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-chatbi_case}_redis
    networks:
      chatbi_internal:
        aliases:
          - redis
    command: ["redis-server", "--appendonly", "yes", "--port", "6381"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
    env_file:
      - .env
    environment:
      # 默认服务名 mysql（与 compose 服务名一致）；第二次 up、部分环境下 container_name 在应用进程内解析失败而 entrypoint 子进程正常
      CHATBI_MYSQL_HOST: "${CHATBI_MYSQL_HOST:-mysql}"
      CHATBI_MYSQL_PORT: "${CHATBI_MYSQL_PORT:-3309}"
      # 供 db.py 在「固化 IP 113 / 解析失败」时仅回退到 Compose 服务名；外置库部署请删除或留空
      CHATBI_MYSQL_DNS_NAME: "${CHATBI_MYSQL_DNS_NAME:-mysql}"
      MYSQL_HOST: "${CHATBI_MYSQL_HOST:-mysql}"
      MYSQL_PORT: "${CHATBI_MYSQL_PORT:-3309}"
      MYSQL_USER: ${MYSQL_USER:-root}
      # 未设置 MYSQL_PASSWORD 时沿用 MYSQL_ROOT_PASSWORD，避免仅配置了 root 密码导致 API 仍用 devroot 连库而注册 500
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-devroot}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat_bi_case}
      REDIS_URL: "${REDIS_URL:-redis://redis:6381/0}"
      STOCK_BOT_IMAGE_DIR: /app/image_show
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatbi_images:/app/image_show
    # 显式指定嵌入式 DNS，减轻个别主机 resolv.conf 异常导致应用进程解析失败
    dns:
      - 127.0.0.11
    networks:
      - chatbi_internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      # 覆盖 entrypoint 最长等待 MySQL（180×2s）+ lifespan 重试（45×2s）+ 余量
      start_period: 540s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    ports:
      - "${CHATBI_HTTP_PORT:-18080}:80"
      - "${CHATBI_HTTPS_PORT:-18443}:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - chatbi_internal

networks:
  chatbi_internal:
    driver: bridge

volumes:
  chatbi_mysql_data:
  chatbi_images:
